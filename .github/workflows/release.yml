name: Release Windows CLI
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching Cargo.toml, e.g. 0.1.0'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Check version
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version.' }
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cargo metadata failed.' }
          if (($meta.packages | Where-Object name -eq 'loop-cli').version -ne $env:RELEASE_VERSION) { throw 'Version must match Cargo.toml.' }
      - name: Check and build
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { throw 'Formatting failed.' }
          cargo test --locked --workspace --all-features
          if ($LASTEXITCODE) { throw 'Tests failed.' }
          cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
          if ($LASTEXITCODE) { throw 'Clippy failed.' }
          cargo build --locked --release -p loop-cli
          if ($LASTEXITCODE) { throw 'Build failed.' }
      - name: Package and test lifecycle
        run: |
          ./scripts/package-release.ps1
          ./scripts/test-install.ps1 -ArchivePath target/release-assets/loop-windows-x64.zip
      - name: Verify published host and application
        run: |
          ./scripts/test-release.ps1 -Binary target/release/loop.exe
      - name: Publish release
        run: |
          gh release create "v$env:RELEASE_VERSION" target/release-assets/loop-windows-x64.zip target/release-assets/loop-windows-x64.zip.sha256 --target "$env:GITHUB_SHA" --title "Loop $env:RELEASE_VERSION" --notes-file docs/release-notes.md --latest
          if ($LASTEXITCODE) { throw 'Release publication failed.' }
