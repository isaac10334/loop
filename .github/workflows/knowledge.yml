name: Repository knowledge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: bun install --frozen-lockfile
      - run: bun run knowledge setup
      - run: bun run knowledge check
      - run: bun test tooling/knowledge.test.ts
