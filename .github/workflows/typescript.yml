name: TypeScript packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tooling/**'
      - 'scripts/check-typescript-packages.ts'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - '.github/workflows/typescript.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'tooling/**'
      - 'scripts/check-typescript-packages.ts'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - '.github/workflows/typescript.yml'
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run typecheck:tooling
