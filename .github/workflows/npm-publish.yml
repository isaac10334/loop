name: npm release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish inspected tarballs (false performs a dry run)
        type: boolean
        default: false
      base:
        description: Optional previous release ref for change planning
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11.16.0
      - run: bun install --frozen-lockfile
      - name: Prepare verified release artifacts and npm dry runs
        env:
          RELEASE_BASE: ${{ inputs.base }}
        run: |
          if [ -n "$RELEASE_BASE" ]; then bun run release:prepare --base "$RELEASE_BASE"; else bun run release:prepare; fi
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: target/npm-pack/
  publish:
    if: ${{ inputs.publish }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11.16.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: release
      - name: Publish exact inspected artifacts in dependency order
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const plan=JSON.parse(readFileSync('release-plan.json'));
          if(!plan.readyToPublish)throw new Error('Release requires clean source, selected packages and reviewed version increments');
          for(const name of plan.publishOrder){const pkg=plan.artifacts.find(pkg=>pkg.name===name);execFileSync('npm',['publish',pkg.file,'--access','public','--provenance','--tag',plan.tag,'--registry',plan.registry],{stdio:'inherit'});}
          JS
