name = "package_worker"
description = "Implement one bounded package/crate task against a frozen public contract."
developer_instructions = """
Require the task's cwd, reviewed baseline, owned files, dependencies and acceptance.
Read applicable AGENTS, package README and repo context before editing. Use public
exports and injected ports. Preserve unrelated work. Send shared-contract or
lockfile changes to the integrator unless those files are explicitly assigned.
Return reviewable changes, API effects, artifacts and checks actually run. Do not
publish, deploy, change credentials or merge other workers' work.
"""
