<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'"><title>Loop native</title><style>body{font:16px system-ui;margin:24px}button,input,select{font:inherit;padding:8px}main{display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:12px}.column{display:flex;flex-direction:column;gap:12px}output{white-space:pre-wrap}</style></head><body><main id="surface" aria-live="polite"></main><script>
'use strict';let sequence=0;window.renderFrame=frame=>{const emit=(node,type,value)=>{const event={revision:frame.revision,sequence:++sequence,key:node.key,type};if(value!==undefined)event.value=value;window.ipc.postMessage(JSON.stringify(event))};const create=node=>{let element;switch(node.type){case'row':case'column':element=document.createElement('section');element.className=node.type;for(const child of node.children||[])element.append(create(child));break;case'text':element=document.createElement('output');element.textContent=node.text||'';break;case'button':element=document.createElement('button');element.textContent=node.text||node.label;element.onclick=()=>emit(node,'activate');break;case'input':element=document.createElement('input');element.value=node.value||'';element.onchange=()=>emit(node,'change',element.value);break;case'toggle':element=document.createElement('input');element.type='checkbox';element.checked=!!node.value;element.onchange=()=>emit(node,'change',element.checked);break;case'select':element=document.createElement('select');for(const item of node.options||[]){const option=document.createElement('option');option.value=item.value;option.textContent=item.label;element.append(option)}element.value=node.value||'';element.onchange=()=>emit(node,'change',element.value);break;default:throw Error('unsupported element')}element.dataset.key=node.key;if(node.label)element.setAttribute('aria-label',node.label);element.disabled=!!node.disabled||!!node.loading;return element};const focused=document.activeElement?.dataset.key;document.querySelector('#surface').replaceChildren(create(frame.root));if(focused){const element=Array.from(document.querySelectorAll('[data-key]')).find(e=>e.dataset.key===focused);element?.focus()}};
</script></body></html>
