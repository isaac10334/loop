[package]
name = "async-document-native-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmtime = { version = "=48.0.0", default-features = false, features = ["anyhow", "std", "runtime", "cranelift", "component-model", "component-model-async", "async"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
serde_json = "1"

[features]
desktop = ["dep:wry", "dep:tao"]

[target.'cfg(windows)'.dependencies]
wry = { version = "=0.56.1", optional = true }
tao = { version = "=0.37.0", optional = true }

[workspace]
