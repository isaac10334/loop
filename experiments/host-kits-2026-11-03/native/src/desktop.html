<!doctype html><meta charset="utf-8"><title>Isolated Rust desktop Component probe</title><h1>Scoped document action</h1><section id="surface"></section><button id="close" onclick="window.ipc.postMessage('close')">Close isolated probe</button><script>window.renderFrame=frame=>{if(!Number.isSafeInteger(frame.revision)||!frame.root)throw Error('frame');const root=document.querySelector('#surface');root.replaceChildren();if(frame.root.type==='button'){const b=document.createElement('button');b.textContent=frame.root.text;b.setAttribute('aria-label',frame.root.label);b.id='guest-button';b.onclick=()=>window.ipc.postMessage(JSON.stringify({revision:frame.revision,sequence:1,key:frame.root.key,type:'activate'}));root.append(b)}else if(frame.root.type==='text'){const o=document.createElement('output');o.id='guest-output';o.textContent=frame.root.text;root.append(o)}else throw Error('unsupported element')};</script>
